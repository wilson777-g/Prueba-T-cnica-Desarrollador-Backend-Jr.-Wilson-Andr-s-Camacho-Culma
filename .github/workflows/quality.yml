name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dna_music_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dna_music_test
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_EXPIRATION: 1h
      NODE_ENV: test
      CORS_ORIGIN: http://127.0.0.1:3001
      E2E_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: Backend dependencies
        working-directory: api
        run: npm ci
      - name: Validate schema and migrations
        working-directory: api
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npm run db:seed
      - name: Backend quality
        working-directory: api
        run: |
          npm run build
          npm test -- --runInBand
          npm audit --audit-level=high
      - name: Frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend quality
        working-directory: web
        run: |
          npm run build
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Start applications
        run: |
          (cd api && node dist/main.js > /tmp/dna-api.log 2>&1 &)
          (cd web && npm run dev -- --host 127.0.0.1 > /tmp/dna-web.log 2>&1 &)
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3001/login
      - name: End-to-end journeys
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14
